<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1f1f">
<meta name="description" content="Teté: offline home workout tracker. No account, no ads, no tracking.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
<title>Teté</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/mark.png" alt=""></div>
<main id="main" aria-live="polite"></main>
<div id="runner" hidden></div>
<div id="toast" role="status"></div>
<div id="sheet" hidden></div>
<div id="focus" hidden></div>
<nav id="tabs">
  <button data-tab="today"><img src="icons/nav/today.png" alt=""><span>Today</span></button>
  <button data-tab="library"><img src="icons/nav/moves.png" alt=""><span>Moves</span></button>
  <button data-tab="checkin"><img src="icons/nav/body.png" alt=""><span>Body</span></button>
  <button data-tab="gear"><img src="icons/nav/settings.png" alt=""><span>Settings</span></button>
</nav>
<script src="strings.js"></script>
<script src="data/library.js"></script>
<script src="data/bodymap.js"></script>
<script src="engine.js"></script>
<script src="dosing.js"></script>
<script src="app.js"></script>
</body>
</html>
